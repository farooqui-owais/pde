# =============================================================================
# PDE Custom Prometheus Alerting Rules
#
# INSTALL:
#   kubectl apply -f monitoring/alerting-rules.yaml
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pde-alerts
  namespace: monitoring
  labels:
    release: monitoring  # Must match the Helm release name
spec:
  groups:
    - name: pde.backend
      rules:
        # High error rate (> 5% of requests returning 5xx)
        - alert: PdeHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="pde", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="pde"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
            service: pde-backend
          annotations:
            summary: "High 5xx error rate in PDE backend"
            description: "More than 5% of requests are returning 5xx errors for the last 5 minutes."

        # High latency (p99 > 2 seconds)
        - alert: PdeHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{namespace="pde"}[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: pde-backend
          annotations:
            summary: "High API latency in PDE backend"
            description: "p99 latency is above 2 seconds for the last 5 minutes."

        # Health endpoint down
        - alert: PdeHealthCheckFailing
          expr: |
            up{job="pde-backend"} == 0
          for: 2m
          labels:
            severity: critical
            service: pde-backend
          annotations:
            summary: "PDE backend health check failing"
            description: "Prometheus cannot scrape the PDE backend /metrics endpoint."

    - name: pde.pods
      rules:
        # Pod crash looping
        - alert: PdePodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="pde"}[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than 3 times in 15 minutes."

        # HPA at maximum replicas
        - alert: PdeHpaAtMax
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="pde"}
            ==
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="pde"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} at max replicas"
            description: "HPA has been at maximum capacity for 15 minutes. Consider increasing max replicas."

        # Pod pending too long
        - alert: PdePodPending
          expr: |
            kube_pod_status_phase{namespace="pde", phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} stuck in Pending state"
            description: "Pod has been Pending for more than 10 minutes. Check node resources and scheduling."
