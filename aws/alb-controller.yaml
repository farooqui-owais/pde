# =============================================================================
# PDE — AWS Load Balancer Controller Setup
#
# This template creates the IAM role and policy required by the
# AWS Load Balancer Controller running in EKS.
#
# PREREQUISITES:
#   - EKS cluster deployed (aws/eks-cluster.yaml)
#   - OIDC provider configured for the cluster
#
# DEPLOY:
#   1. Deploy this CloudFormation stack:
#      aws cloudformation deploy \
#        --stack-name pde-alb-controller \
#        --template-file aws/alb-controller.yaml \
#        --capabilities CAPABILITY_NAMED_IAM \
#        --parameter-overrides \
#          ClusterName=pde-cluster \
#          OIDCIssuerUrl=<from EKS stack output> \
#        --region ap-south-1
#
#   2. Install the controller via Helm:
#      helm repo add eks https://aws.github.io/eks-charts
#      helm repo update
#      helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#        -n kube-system \
#        --set clusterName=pde-cluster \
#        --set serviceAccount.create=true \
#        --set serviceAccount.name=aws-load-balancer-controller \
#        --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=<RoleArn from stack output>
# =============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Description: IAM resources for AWS Load Balancer Controller on EKS

Parameters:
  ClusterName:
    Type: String
    Default: pde-cluster
  OIDCIssuerUrl:
    Type: String
    Description: "OIDC issuer URL from EKS cluster (without https:// prefix)"

Resources:
  ALBControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-alb-controller-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCIssuerUrl}"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                !Sub "${OIDCIssuerUrl}:aud": sts.amazonaws.com
                !Sub "${OIDCIssuerUrl}:sub": system:serviceaccount:kube-system:aws-load-balancer-controller
      Policies:
        - PolicyName: ALBControllerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:*
                  - ec2:DescribeInstances
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeTags
                  - ec2:DescribeCoipPools
                  - ec2:GetCoipPoolUsage
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - iam:CreateServiceLinkedRole
                  - cognito-idp:DescribeUserPoolClient
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - wafv2:GetWebACL
                  - wafv2:GetWebACLForResource
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - shield:GetSubscriptionState
                  - shield:DescribeProtection
                  - shield:CreateProtection
                  - shield:DeleteProtection
                Resource: "*"

Outputs:
  RoleArn:
    Description: IAM role ARN for AWS Load Balancer Controller
    Value: !GetAtt ALBControllerRole.Arn
  HelmInstallCommand:
    Description: Helm command to install the controller
    Value: !Sub |
      helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
        -n kube-system \
        --set clusterName=${ClusterName} \
        --set serviceAccount.create=true \
        --set serviceAccount.name=aws-load-balancer-controller \
        --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${ALBControllerRole.Arn}
