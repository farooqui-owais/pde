AWSTemplateFormatVersion: "2010-09-09"

# =====================================================================
#  PDE (DakhalNama) - AWS Infrastructure - Single CloudFormation template
# =====================================================================
#  One `aws cloudformation deploy` builds the WHOLE free-tier stack:
#    Network   : VPC, public + private (DB) subnets, IGW, route tables, SGs
#    Compute   : EC2 t3.micro (AL2023) = Nginx + Gunicorn/FastAPI, SPA served
#                in /, /api reverse-proxied to the API. EIP + IAM role.
#    Database  : RDS PostgreSQL 16 db.t3.micro (20 GB), private subnet,
#                automated backups = bulk charging, deletion guardrail.
#    Storage   : encrypted, versioned S3 bucket (media / backups / artifacts)
#    CDN/TLS   : CloudFront + ACM (optional, needs a custom domain)
#    DNS       : Route 53 records (optional, with domain)
#    Monitor   : CloudWatch alarms + SNS + app log group
#
#  FREE-TIER facts (12-month free tier needs a NEW AWS account):
#    EC2 t3.micro 750h/mo, RDS db.t3.micro+20GB, S3 5GB, CloudFront 1TB
#    +10M req, 10 CloudWatch metrics / 5 alarms / 1GB logs, ACM certs, SNS.
#    NOT free: NAT Gateway, ALB, detached EIPs -> we avoid all of those.
#
#  DEPLOY:
#    aws cloudformation deploy --stack-name pde-infra \
#      --template-file infrastructure.yaml \
#      --parameter-overrides file://parameters/dev.json \
#      --capabilities CAPABILITY_IAM --region ap-south-1
#  Then wait ~10-15 min (user-data installs + boots the app automatically).
# =====================================================================

Description: Complete free-tier AWS infrastructure for the DakhalNama / PDE app.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Core }
        Parameters: [EnvironmentName, ProjectName]
      - Label: { default: Networking }
        Parameters: [VpcCIDR, PublicSubnetCIDR, DbSubnetCIDR]
      - Label: { default: Compute (EC2) }
        Parameters: [InstanceType, KeyPairName, RepoUrl, RepoBranch, AppDir]
      - Label: { default: Database (RDS) }
        Parameters: [DBInstanceClass, DBAllocatedStorage, DBName, DBUser, DBPassword]
      - Label: { default: Application settings }
        Parameters: [AppDomain, AcmCertificateArn, CorsOrigins, TrustedHosts, SecretKey]
      - Label: { default: Monitoring }
        Parameters: [AlertEmail, Ec2CpuAlarmThreshold, DbFreeStorageAlarmThreshold]

Parameters:
  # --------------------------- Core --------------------------------
  EnvironmentName:
    Type: String
    Default: pde
    Description: Short environment name used in tags and defaults.
    AllowedPattern: "[a-z0-9-]+"
  ProjectName:
    Type: String
    Default: dakhalnama
    Description: Product / billing tag.

  # --------------------------- Networking --------------------------
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "((\\d{1,3})\\.){3}\\d{1,3}/\\d{1,2}"
  PublicSubnetCIDR:
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: "((\\d{1,3})\\.){3}\\d{1,3}/\\d{1,2}"
  DbSubnetCIDR:
    Type: String
    Default: 10.0.2.0/24
    Description: Private subnet for RDS.
    AllowedPattern: "((\\d{1,3})\\.){3}\\d{1,3}/\\d{1,2}"
  DbSubnetCIDR2:
    Type: String
    Default: 10.0.3.0/24
    Description: Second private subnet for RDS (RDS requires subnets in >= 2 AZs).
    AllowedPattern: "((\\d{1,3})\\.){3}\\d{1,3}/\\d{1,2}"

  # --------------------------- Compute ------------------------------
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 type. t3.micro = free-tier eligible.
    AllowedValues: [t3.micro, t3.small, t3.medium, t4g.micro, t4g.small]
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key-pair name for SSH.
  RepoUrl:
    Type: String
    Default: https://github.com/your-org/pde.git
    Description: Git repo that contains pde-backend/ and pde-frontend/ folders.
  RepoBranch:
    Type: String
    Default: main
  AppDir:
    Type: String
    Default: /opt/pde
    Description: Where the app is installed on the EC2 instance.

  # --------------------------- Database -----------------------------
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS class. db.t3.micro = free-tier eligible (single-AZ).
    AllowedValues: [db.t3.micro, db.t3.small, db.t4g.micro, db.t4g.small]
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: Postgres storage in GB (20 GB = free-tier limit).
  DBName:
    Type: String
    Default: pde
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBUser:
    Type: String
    Default: dakhal_user
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 50
    Description: Postgres master password (letters+digits only, safe in .env).
    AllowedPattern: "[a-zA-Z0-9]*"

  # Latest Amazon Linux 2023 AMI id, auto-resolved per region via SSM.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  # --------------------------- Application --------------------------
  AppDomain:
    Type: String
    Default: ""
    Description: >
      Optional custom domain (app.example.com). If provided we attach an ACM
      cert + CloudFront + Route 53 records. Leave empty to use the public IP.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: ARN of an existing ACM cert in us-east-1 matching AppDomain.
  CorsOrigins:
    Type: String
    Default: http://localhost:5173,http://127.0.0.1:5173
    Description: Comma-separated allowed CORS origins (include AppDomain in prod).
  TrustedHosts:
    Type: String
    Default: "*"
    Description: API TRUSTED_HOSTS (set to AppDomain in production).
  SecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: JWT secret >= 32 chars; leave empty to auto-generate at boot.

  # --------------------------- Monitoring ---------------------------
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for CloudWatch/SNS alarms. Optional.
  Ec2CpuAlarmThreshold:
    Type: Number
    Default: 85
  DbFreeStorageAlarmThreshold:
    Type: Number
    Default: 10737418240

# --------------------------- Conditions ----------------------------
Conditions:
  HasDomain: !Not [!Equals [!Ref AppDomain, ""]]
  HasCert: !Not [!Equals [!Ref AcmCertificateArn, ""]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  UsesCloudFront: !And
    - Condition: HasDomain
    - Condition: HasCert

Resources:
  # =====================================================================
  # 1. NETWORK
  # =====================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCIDR
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-subnet"

  DbSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DbSubnetCIDR
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet"

  DbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DbSubnetCIDR2
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet-2"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Private route table with NO default route -> RDS stays off the internet
  # and we do NOT need a (paid) NAT gateway.
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-rt"

  DbSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnet
      RouteTableId: !Ref DbRouteTable

  DbSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnet2
      RouteTableId: !Ref DbRouteTable

  # =====================================================================
  # 2. SECURITY GROUPS
  # =====================================================================
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS from internet, SSH from anywhere
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (Nginx / CloudFront origin)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH (restrict to your IP in prod)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-web-sg"

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres 5432 from web SG only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
          Description: Postgres from app servers
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-sg"
  # =====================================================================
  # 3. IAM ROLE + INSTANCE PROFILE
  # =====================================================================
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: Ec2Lifecycle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeTags, ec2:DescribeInstances, cloudwatch:PutMetricData]
                Resource: "*"

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role
  # =====================================================================
  # 4. EC2 APP INSTANCE  (nginx + gunicorn/FastAPI)
  # =====================================================================
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      Monitoring: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          # PDE bootstrap - Amazon Linux 2023
          exec > >(tee /var/log/user-data.log | logger -t pde-boot -s 2>/dev/console) 2>&1
          set -e

          # ---- system packages ----
          dnf -y update
          dnf -y install nginx git python3.11 python3.11-pip gcc python3.11-devel \
            libpq-devel curl tar gzip cronie

          # ---- Node 20 (build-time only; Vite needs >=18) ----
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash - || true
          dnf -y install nodejs || true
          node -v; npm -v

          # ---- fetch app code ----
          mkdir -p ${AppDir}
          cd ${AppDir}
          if [ -d pde/.git ]; then
            cd pde && git fetch --all && git checkout ${RepoBranch} && git pull
          else
            git clone --branch ${RepoBranch} --depth 1 ${RepoUrl} ${AppDir}/pde
          fi

          # ---- python env + backend deps ----
          python3.11 -m venv ${AppDir}/venv
          ${AppDir}/venv/bin/pip install --upgrade pip
          ${AppDir}/venv/bin/pip install -r ${AppDir}/pde/pde-backend/requirements.txt

          # ---- build frontend (same-origin /api via nginx) ----
          cd ${AppDir}/pde/pde-frontend
          export VITE_API_BASE_URL=/
          npm ci
          npm run build

          # ---- JWT secret ----
          SECRET=${SecretKey}
          if [ -z "$SECRET" ]; then
            SECRET=$(${AppDir}/venv/bin/python -c "import secrets,sys;sys.stdout.write(secrets.token_urlsafe(48))")
          fi

          # ---- backend .env ----
          # Secure cookies only make sense behind HTTPS (custom domain/CDN).
          DOMAIN="${AppDomain}"
          if [ -n "$DOMAIN" ]; then
            CSRF_SECURE=True
          else
            CSRF_SECURE=False
          fi
          cat > ${AppDir}/pde/pde-backend/.env <<EOF
          DEBUG=False
          APP_VERSION=1.0.0
          DATABASE_URL=postgresql://${DBUser}:${DBPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}
          SECRET_KEY=$SECRET
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=120
          CORS_ORIGINS=${CorsOrigins}
          CSRF_COOKIE_NAME=csrf_token
          CSRF_HEADER_NAME=X-CSRF-Token
          CSRF_COOKIE_SECURE=$CSRF_SECURE
          CSRF_COOKIE_SAMESITE=lax
          TRUSTED_HOSTS=${TrustedHosts}
          RATE_LIMIT_MAX=8
          RATE_LIMIT_WINDOW_SECONDS=60
          EOF

          # ---- systemd unit: API ----
          cat > /etc/systemd/system/pde-api.service <<EOF
          [Unit]
          Description=PDE API (FastAPI)
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=root
          WorkingDirectory=${AppDir}/pde/pde-backend
          EnvironmentFile=${AppDir}/pde/pde-backend/.env
          ExecStart=${AppDir}/venv/bin/gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker -b 127.0.0.1:8000
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now pde-api

          # ---- nginx: SPA + /api proxy (quoted heredoc keeps nginx vars) ----
          cat > /etc/nginx/conf.d/pde.conf <<'NGINX'
          server {
            listen 80 default_server;
            server_name _;
            root ${AppDir}/pde/pde-frontend/dist;
            index index.html;
            client_max_body_size 20m;
            gzip on;
            gzip_types text/plain text/css application/json application/javascript;
            location /api/ {
              proxy_pass http://127.0.0.1:8000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
            }
            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          NGINX
          rm -f /etc/nginx/conf.d/default.conf
          nginx -t
          systemctl enable --now nginx
          systemctl restart nginx

          echo "PDE bootstrap complete"

  # =====================================================================
  # 5. ELASTIC IP (stable origin for DNS / CloudFront; free while attached)
  # =====================================================================
  AppElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-eip"

  AppElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt AppElasticIp.AllocationId
      InstanceId: !Ref AppInstance
  # =====================================================================
  # 6. DATABASE (RDS PostgreSQL)
  # =====================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref DbSubnet
        - !Ref DbSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet-group"

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgres"
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp2
      DBName: !Ref DBName
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: "02:00-03:00"
      PreferredMaintenanceWindow: "sun:04:00-sun:05:00"
      DeletionProtection: false
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      MaxAllocatedStorage: 100
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-postgres"
        - Key: Environment
          Value: !Ref EnvironmentName

  # =====================================================================
  # 7. S3 BUCKET (encrypted + versioned) - media, uploads, backups, artifacts
  # =====================================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${EnvironmentName}-${AWS::AccountId}-artifacts"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-artifacts"

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  # =====================================================================
  # 8. CLOUDFRONT CDN + TLS  (only when a domain + ACM cert are provided)
  # =====================================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UsesCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${EnvironmentName}-pde"
        DefaultCacheBehavior:
          TargetOriginId: pde-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
            Headers:
              - Origin
              - Authorization
              - Host
              - X-CSRF-Token
              - Access-Control-Request-Method
              - Access-Control-Request-Headers
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        Origins:
          - Id: pde-origin
            DomainName: !GetAtt AppInstance.PublicDnsName
            OriginPath: ""
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Aliases:
          - !Ref AppDomain
        PriceClass: PriceClass_100
        Logging:
          Bucket: !Sub "${ArtifactBucket.DomainName}"
          Prefix: cloudfront-logs/
        HttpVersion: http2

  # =====================================================================
  # 9. ROUTE 53 (optional, with domain)
  # =====================================================================
  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: UsesCloudFront
    Properties:
      Name: !Ref AppDomain
      HostedZoneConfig:
        Comment: PDE app

  AppRecord:
    Type: AWS::Route53::RecordSet
    Condition: UsesCloudFront
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref AppDomain
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName

  AppRecordWww:
    Type: AWS::Route53::RecordSet
    Condition: UsesCloudFront
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "www.${AppDomain}"
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
  # =====================================================================
  # 10. MONITORING (CloudWatch + SNS)
  # =====================================================================
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/pde/${EnvironmentName}/app"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-log-group"

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub "${EnvironmentName}-alerts"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alerts"

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

  Ec2CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "${EnvironmentName}-app-cpu"
      AlarmDescription: High CPU on the app instance
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      Period: 300
      Statistic: Average
      Threshold: !Ref Ec2CpuAlarmThreshold
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      AlarmActions:
        - !Ref AlertTopic

  Ec2StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "${EnvironmentName}-app-status"
      AlarmDescription: Instance status check failed
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Maximum
      Threshold: 1
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      AlarmActions:
        - !Ref AlertTopic

  DbFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: !Sub "${EnvironmentName}-db-storage"
      AlarmDescription: Low free storage on the database
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: !Ref DbFreeStorageAlarmThreshold
      TreatMissingData: notBreaching
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      AlarmActions:
        - !Ref AlertTopic

  # =====================================================================
  # OUTPUTS
  # =====================================================================
Outputs:
  PublicIp:
    Description: Public IP of the app server (HTTP unless domain/CDN used)
    Value: !Ref AppElasticIp

  PublicDns:
    Description: Public DNS of the app server
    Value: !GetAtt AppInstance.PublicDnsName

  AppHttpUrl:
    Description: Direct HTTP URL (dev). Use CloudFront domain for production.
    Value: !Sub "http://${AppElasticIp}"

  DatabaseEndpoint:
    Description: Postgres endpoint
    Value: !GetAtt Database.Endpoint.Address

  DatabaseName:
    Value: !Ref DBName

  ArtifactBucket:
    Description: Encrypted, versioned S3 bucket
    Value: !Ref ArtifactBucket

  ApiHealthCheck:
    Description: Health endpoint
    Value: !Sub "http://${AppElasticIp}/api/health"

  CloudFrontDomain:
    Condition: UsesCloudFront
    Description: CloudFront/CDN URL (use in CORS_ORIGINS)
    Value: !GetAtt CloudFrontDistribution.DomainName
