# =============================================================================
# pde.conf - Nginx site for the PDE (DakhalNama) app
# -----------------------------------------------------------------------------
# Serves the built React SPA from the given root and reverse-proxies the
# /api/ path to the FastAPI app (Gunicorn/Uvicorn) on 127.0.0.1:8000.
#
# This is the exact config that EC2 user-data writes to
# /etc/nginx/conf.d/pde.conf during the CloudFormation bootstrap.
# Keep the two in sync if you change anything here.
#
# Adjust `root` to match AppDir: ${AppDir}/pde/pde-frontend/dist
# =============================================================================

server {
  listen 80 default_server;
  server_name _;

  # Location of the built frontend (Vite `npm run build` output).
  root /opt/pde/pde/pde-frontend/dist;
  index index.html;

  # Allow reasonably large uploaded documents / fields.
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # ---- API: reverse proxy to FastAPI (Gunicorn) ----
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    # Preserve the original request/forward info so the app can build the
    # correct absolute URLs, honor trusted hosts, and know it is behind TLS.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    client_max_body_size 20m;
  }

  # ---- SPA: client-side route fallback (no 404 on refresh) ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}