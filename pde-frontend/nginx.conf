# =============================================================================
# PDE Frontend — Nginx Configuration (Production Container)
# Serves static React/Vite build and proxies /api to backend service
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security Headers ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Gzip Compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- Static Asset Caching ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- API Proxy ----------
    # In Kubernetes, the backend is accessible via backend-svc.pde.svc.cluster.local
    # This resolver + upstream variable pattern handles DNS resolution at runtime
    location /api/ {
        # Use Kubernetes DNS resolver
        resolver kube-dns.kube-system.svc.cluster.local valid=10s;
        set $backend_upstream http://backend-svc.pde.svc.cluster.local:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # ---------- SPA Fallback ----------
    # All non-file routes fall back to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Health Check ----------
    location /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
