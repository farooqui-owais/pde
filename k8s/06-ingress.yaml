# OPTIONAL — Ingress (single entry point / path-based routing).
#
# Docker Desktop's built-in Kubernetes does NOT ship an ingress controller by
# default, so this manifest does nothing until you install one, e.g.:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/cloud/deploy.yaml
#
# The docker-compose overview says "make use of docker-compose if needed" —
# for the local walkthrough the two LoadBalancer Services (backend at :8000,
# frontend at :5173) are enough. Use an Ingress only when you want host/path
# routing or TLS in a more production-shaped setup.
#
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: pde-ingress
#   namespace: pde
# spec:
#   ingressClassName: nginx
#   rules:
#     - host: app.localhost
#       http:
#         paths:
#           - path: /api
#             pathType: Prefix
#             backend:
#               service:
#                 name: backend-svc
#                 port:
#                   number: 8000
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: frontend-svc
#                 port:
#                   number: 5173