# Secrets for the PDE stack. For a LOCAL / demo cluster only.
#
# stringData stores plain text and lets Kubernetes base64-encode it for you.
# In a real deployment use a proper secrets manager / sealed secrets and put a
# REAL random SECRET_KEY (python -c "import secrets; print(secrets.token_urlsafe(64))").
#
# NOTE: The Postgres password is deliberately kept in sync with DATABASE_URL in
# 01-configmap.yaml so the backend can connect without a second DSN.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: pde
type: Opaque
stringData:
  # DEMO-ONLY value — replace with a real random secret before any real use.
  SECRET_KEY: CHANGE_ME_demo_only_do_not_use_in_production_0123456789
  POSTGRES_PASSWORD: postgres
