# Frontend (React + Vite dev server) + a Service LoadBalancer.
# Browser access at http://localhost:5173 via the Docker Desktop localhost mapping.
#
# VITE_API_BASE_URL is injected at container start; the frontend calls the API
# at localhost:8000 which the backend LoadBalancer exposes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pde
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: pde/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: VITE_API_BASE_URL
              value: http://localhost:8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: pde
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173