# Non-secret backend configuration. Mirrors the env vars in docker-compose.yml
# / pde-backend/.env.example but points DATABASE_URL at the in-cluster Postgres
# service name (postgres-svc) instead of localhost.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: pde
data:
  # DSName uses the Postgres <Service>.<namespace> DNS name.
  DATABASE_URL: postgresql://postgres:postgres@postgres-svc.pde.svc.cluster.local:5432/pde
  # Dev setting. Set to "False" in a real deployment (disables /docs, /redoc).
  DEBUG: "True"
  ACCESS_TOKEN_EXPIRE_MINUTES: "120"
  # Exact CORS allowlist; must include whatever origin the browser uses.
  CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  CSRF_COOKIE_SECURE: "False"
  CSRF_COOKIE_SAMESITE: lax
  RATE_LIMIT_MAX: "8"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  TRUSTED_HOSTS: "*"
