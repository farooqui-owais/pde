# Layer after the base and low-memory files for the Vite development server.
services:
  frontend:
    build:
      dockerfile: Dockerfile
    mem_limit: 512m
    mem_reservation: 128m
    memswap_limit: 512m
    environment: !override
      VITE_API_BASE_URL: http://localhost:8000
      NODE_OPTIONS: --max-old-space-size=384
    ports: !override
      - "5173:5173"
    volumes: !override []
    healthcheck:
      disable: true
