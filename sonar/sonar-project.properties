# =============================================================================
# SonarQube analysis scope — PDE (DakhalNama) monorepo
#
# STAGED FILE. When implemented, copy this to the repo root (the scanner's
# base directory), then run:
#   docker run --rm -e SONAR_HOST_URL=http://host.docker.internal:9000 \
#     -e SONAR_TOKEN=<token> -v "${PWD}:/usr/src" \
#     sonarsource/sonar-scanner-cli
#
# Backend and frontend are analyzed as ONE project so a single quality gate
# covers the whole application.
# =============================================================================

sonar.projectKey=pde
sonar.projectName=PDE (DakhalNama)
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Sources / tests — paths verified against the repository layout
# -----------------------------------------------------------------------------
sonar.sources=pde-backend/app,pde-frontend/src
sonar.tests=pde-backend/tests
sonar.test.inclusions=**/tests/**/*.py

# Keep the Python analyzer aligned with the runtime image (python:3.11-slim in
# pde-backend/Dockerfile) so version-specific rules fire correctly.
sonar.python.version=3.11

# -----------------------------------------------------------------------------
# Coverage
#
# Produced by:  pytest tests/ --cov=app --cov-report=xml   (run in pde-backend/)
# The GitHub workflow .github/workflows/ci.yml already generates and uploads
# this file as the `backend-coverage` artifact; the LOCAL pipeline does not yet
# emit it — adding --cov-report=xml to the Backend Quality Gate stage is part
# of the plan (Phase S3).
# -----------------------------------------------------------------------------
sonar.python.coverage.reportPaths=pde-backend/coverage.xml

# Frontend has no test runner yet (pde-frontend/package.json has only
# dev/build/preview — no test script, and eslint is not in devDependencies
# despite eslint.config.js existing). So there is no LCOV report to point at.
# The JS/TS analyzer still reports bugs, code smells, security issues and
# duplication — only the coverage metric is absent. Uncomment this line after
# adding a coverage-capable runner (e.g. vitest + @vitest/coverage-v8):
# sonar.javascript.lcov.reportPaths=pde-frontend/coverage/lcov.info

# -----------------------------------------------------------------------------
# Exclusions
#
# The scanner reads the FILESYSTEM, not git — so gitignored-but-present files
# must be excluded here too. pde-backend/.env and pde-frontend/.env both exist
# on disk. pde-backend/uploads/ holds user-uploaded files.
#
# NOTE: `sonar.exclusions` does not support `!` negation in a way we can rely
# on, so `**/.env.*` also excludes `.env.example`. That is acceptable — the
# example files contain placeholders only, and excluding a template from
# analysis costs nothing.
# -----------------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/dist-ssr/**,\
  **/coverage/**,\
  **/.vite/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/.ruff_cache/**,\
  **/.pytest_cache/**,\
  **/.scannerwork/**,\
  **/*.min.js,\
  **/*.log,\
  **/.env,\
  **/.env.*,\
  pde-backend/uploads/**,\
  pde-backend/app/database.local.py,\
  .kilo/**,\
  pde-antigravity-documentation/**,\
  sonar/**

# Duplication: locale/i18n JSON files are structurally near-identical by design,
# so including them inflates the duplication metric without indicating a real
# maintainability problem.
sonar.cpd.exclusions=pde-frontend/src/**/locales/**,**/*.json

# -----------------------------------------------------------------------------
# Quality gate
#
# `sonar.qualitygate.wait=true` is passed on the command line rather than set
# here, so manual ad-hoc scans are not forced to block on the gate.
# -----------------------------------------------------------------------------
