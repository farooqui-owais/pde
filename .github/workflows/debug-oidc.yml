name: Debug OIDC

# TEMPORARY diagnostic: prints the exact JWT `sub` and `aud` claims GitHub
# sends, so we can match the role's trust policy precisely. Delete this file
# once the Deploy workflow authenticates. Run manually (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Decode GitHub OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          # Print payload (2nd segment of the JWT), base64-decoded + pretty
          echo "$TOKEN" | cut -d. -f2 | \
            python3 -c "import sys,base64,json; \
              p=sys.stdin.read().strip(); p+='='*(-len(p)%4); \
              print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))"