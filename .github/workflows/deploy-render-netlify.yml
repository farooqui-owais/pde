name: Deploy to Netlify & Render

# LOCAL-FIRST POLICY (see GITHUB-ACTIONS.md)
# ------------------------------------------
# Manual trigger only. The push trigger is disabled because the Netlify /
# Render secrets are not configured in this repo yet — every push used to
# fail. Re-add the push trigger once NETLIFY_* / RENDER_* secrets exist.

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'pde-frontend/**'
  #     - 'pde-backend/**'
  #     - 'render.yaml'
  #     - 'netlify.toml'
  workflow_dispatch:

concurrency:
  group: cloud-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality Gates
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pde-backend/requirements-dev.txt

      - name: Test Backend
        run: |
          cd pde-backend
          pip install -r requirements-dev.txt
          ruff check app/
          pytest tests/ --cov=app -v
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "cloud-ci-test-key-32-chars-long"
          DEBUG: "True"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pde-frontend/package-lock.json

      - name: Test & Build Frontend
        run: |
          cd pde-frontend
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/' }}

  # ---------------------------------------------------------------------------
  # 2. Deploy Frontend to Netlify
  # ---------------------------------------------------------------------------
  deploy-frontend-netlify:
    name: Deploy Frontend (Netlify)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pde-frontend/package-lock.json

      - name: Build Frontend for Production
        run: |
          cd pde-frontend
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/' }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './pde-frontend/dist'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions [commit: ${{ github.sha }}]"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ---------------------------------------------------------------------------
  # 3. Deploy Backend to Render
  # ---------------------------------------------------------------------------
  deploy-backend-render:
    name: Deploy Backend (Render)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not configured in repository." >&2
            exit 1
          fi
          echo "Triggering deploy hook on Render..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Post-Deploy Verification
        # NOTE: the `secrets` context is NOT valid in `if:` — map it to an
        # env var and test the env var instead (the old
        # `if: ${{ secrets.RENDER_BACKEND_URL != '' }}` broke workflow parsing).
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        if: env.RENDER_BACKEND_URL != ''
        run: |
          echo "Waiting for Render deployment to become healthy..."
          curl --fail --retry 10 --retry-delay 15 --silent --show-error \
            "$RENDER_BACKEND_URL/api/health"
