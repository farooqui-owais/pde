name: CI

# Single source of truth for quality gates on PRs and pushes to main.
# LOCAL-FIRST POLICY: this is the ONLY workflow that auto-runs on every push.
# All deploy workflows (EKS / EC2 / on-prem / Render-Netlify) are manual-only
# until their target is configured — see GITHUB-ACTIONS.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'local-k8s/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a new push cancels the superseded run — fewer red builds, less minutes


jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pde-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pde-backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff check)
        run: ruff check app/
      - name: Format check (ruff format)
        run: ruff format --check app/
      - name: Syntax check
        run: python -m compileall -q app
      - name: Unit tests with coverage
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v
        env:
          DATABASE_URL: "sqlite:///:memory:"
          DEBUG: "True"
          SECRET_KEY: "ci-test-secret-key-32-chars-long-enough!"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: pde-backend/coverage.xml

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pde-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pde-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npx eslint src/
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: pde-frontend/dist
