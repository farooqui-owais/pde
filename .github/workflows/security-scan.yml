name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-sast:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pde-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit==1.7.9
      - name: Run Bandit
        run: bandit -r app/ -c bandit.yml -f json -o bandit-report.json || true
      - name: Display results
        if: always()
        run: bandit -r app/ -c bandit.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: pde-backend/bandit-report.json

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python dependency audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r pde-backend/requirements.txt --format json --output pip-audit-report.json || true
          pip-audit -r pde-backend/requirements.txt
      - name: Node dependency audit
        working-directory: pde-frontend
        run: npm audit --audit-level=high || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [python-sast, dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pde/backend:scan ./pde-backend
      - name: Build frontend image
        run: docker build -t pde/frontend:scan ./pde-frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'pde/backend:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'pde/frontend:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

  iac-scan:
    name: IaC & Manifest Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan CloudFormation & K8s manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: cloudformation,kubernetes
          soft_fail: true
          output_format: cli
