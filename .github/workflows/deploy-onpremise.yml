name: Deploy to On-Premise

# LOCAL-FIRST POLICY (see GITHUB-ACTIONS.md)
# ------------------------------------------
# Manual trigger only. The push trigger is disabled because the on-premise
# SSH secrets are not configured in this repo yet — every push used to fail.
# Re-add the push trigger once ONPREMISE_* secrets are configured.

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'on-premise/**'
  #     - 'pde-backend/**'
  #     - 'pde-frontend/**'
  workflow_dispatch:

concurrency:
  group: onpremise-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality Gates (Lint & Test)
  # ---------------------------------------------------------------------------
  quality-check:
    name: Code Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pde-backend/requirements-dev.txt

      - name: Backend Tests
        run: |
          cd pde-backend
          pip install -r requirements-dev.txt
          ruff check app/
          pytest tests/ --cov=app -v
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-purpose-only"
          DEBUG: "True"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pde-frontend/package-lock.json

      - name: Frontend Build Verification
        run: |
          cd pde-frontend
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: "/"

  # ---------------------------------------------------------------------------
  # 2. Deploy to On-Premise Host via SSH
  # ---------------------------------------------------------------------------
  deploy-onpremise:
    name: Deploy to On-Premise Server
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast with an actionable message instead of a cryptic SSH error
      # when secrets are missing. (The `secrets` context cannot be used in
      # `if:` conditions, so map secrets to env vars and test those.)
      - name: Verify deploy secrets are configured
        env:
          HOST: ${{ secrets.ONPREMISE_HOST }}
          USER: ${{ secrets.ONPREMISE_USER }}
          KEY: ${{ secrets.ONPREMISE_SSH_KEY }}
        run: |
          MISSING=""
          [ -z "$HOST" ] && MISSING="ONPREMISE_HOST "
          [ -z "$USER" ] && MISSING="${MISSING}ONPREMISE_USER "
          [ -z "$KEY" ]  && MISSING="${MISSING}ONPREMISE_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repo secrets: $MISSING"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ONPREMISE_HOST }}
          username: ${{ secrets.ONPREMISE_USER }}
          key: ${{ secrets.ONPREMISE_SSH_KEY }}
          port: ${{ secrets.ONPREMISE_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.ONPREMISE_PATH || '/opt/pde' }}"
            echo "Navigating to deployment directory: ${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"
            
            echo "Fetching latest changes from repository..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "Executing On-Premise Deploy Script..."
            bash on-premise/scripts/deploy.sh

      - name: Post-Deploy Smoke Test
        # NOTE: the `secrets` context is NOT valid in `if:` — map it to an
        # env var and test the env var instead (the old
        # `if: ${{ secrets.ONPREMISE_URL != '' }}` broke workflow parsing).
        env:
          ONPREMISE_URL: ${{ secrets.ONPREMISE_URL }}
        if: env.ONPREMISE_URL != ''
        run: |
          echo "Verifying application status at $ONPREMISE_URL..."
          curl --fail --retry 5 --retry-delay 10 --silent --show-error \
            "$ONPREMISE_URL/api/health"
