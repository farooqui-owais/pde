name: Deploy

# Deploys to the production EC2 on merge to `main` (or manual trigger).
# See CICD.md for the full design and the OIDC role setup required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for GitHub to mint an OIDC token for AWS auth
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Authenticate to AWS via OIDC — no long-lived access keys.
      #    Replace <ACCOUNT_ID> with your AWS account id and pre-create the
      #    `github-actions` role per CICD.md §6.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::967501764038:role/github-actions

      # 2) Trigger the on-box deploy via SSM Run Command (agent ships with AL2023).
      #    The EC2 looks up the instance via the `Name=pde-app` tag.
      - name: Trigger deploy on EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=pde-app" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ]; then
            echo "No instance tagged Name=pde-app found." >&2
            exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/pde/deploy-cd.sh"]' \
            --timeout-seconds 600 \
            --output text

      # 3) Post-deploy health check against the instance's real public IP
      #    (re-resolved here — runner shells do not share variables).
      - name: Health check
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "No public IP on the instance." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 \
            "http://${PUBLIC_IP}/api/health"
