# =============================================================================
# DakhalNama / PDE — On-Premise Production Docker Compose Stack
# Components:
#   - db:        PostgreSQL 16 Alpine with persistent data volume
#   - backend:   FastAPI (Gunicorn + Uvicorn workers)
#   - frontend:  React 18 + Vite (SPA served by internal Nginx)
#   - proxy:     Central Nginx Reverse Proxy (SSL, rate limiting, routing)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: pde-onpremise-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dakhal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dakhal_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dakhalnama}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - onpremise_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dakhal_user} -d ${POSTGRES_DB:-dakhalnama}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pde-internal
    # Only expose port locally if external DBA access is explicitly required
    ports:
      - "${DB_EXTERNAL_PORT:-127.0.0.1:5432}:5432"

  # ---------------------------------------------------------------------------
  # 2. Backend: FastAPI Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../pde-backend
      dockerfile: Dockerfile
    container_name: pde-onpremise-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dakhal_user}:${POSTGRES_PASSWORD:-dakhal_secure_pass_2026}@db:5432/${POSTGRES_DB:-dakhalnama}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      APP_NAME: ${APP_NAME:-DakhalNama PDE API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-False}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://localhost,http://127.0.0.1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      CSRF_COOKIE_SAMESITE: ${CSRF_COOKIE_SAMESITE:-lax}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-csrf_token}
      CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-CSRF-Token}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - onpremise_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pde-internal
    expose:
      - "8000"

  # ---------------------------------------------------------------------------
  # 3. Frontend: React + Vite SPA
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../pde-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/"
    container_name: pde-onpremise-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pde-internal
    expose:
      - "80"

  # ---------------------------------------------------------------------------
  # 4. Ingress Reverse Proxy: Central Nginx
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: pde-onpremise-proxy
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pde-internal

# -----------------------------------------------------------------------------
# Networks & Persistent Volumes
# -----------------------------------------------------------------------------
networks:
  pde-internal:
    driver: bridge
    name: pde-onpremise-network

volumes:
  onpremise_pgdata:
    name: pde-onpremise-pgdata
  onpremise_uploads:
    name: pde-onpremise-uploads
