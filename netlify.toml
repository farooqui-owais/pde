# =============================================================================
# DakhalNama / PDE — Netlify Configuration
# Builds and deploys React + Vite frontend SPA with routing and security headers
# =============================================================================

[build]
  base = "pde-frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_BASE_URL here or in the Netlify site environment variables
  # e.g., VITE_API_BASE_URL = "https://pde-backend.onrender.com"

# -----------------------------------------------------------------------------
# Optional: Netlify API Proxy (eliminates cross-domain CORS issues)
# Uncomment if you want /api requests routed transparently to Render backend
# -----------------------------------------------------------------------------
# [[redirects]]
#   from = "/api/*"
#   to = "https://pde-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# -----------------------------------------------------------------------------
# Single Page Application (SPA) Client Routing Rule
# Redirect all unhandled URLs to index.html with HTTP 200 so React Router works
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Security & Asset Headers
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
