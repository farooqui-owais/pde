apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: {{ include "pde.namespace" . }}
  labels:
    {{- include "pde.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pde.backend.selectorLabels" . | nindent 4 }}
