apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pde.fullname" . }}-test-connection"
  namespace: {{ include "pde.namespace" . }}
  labels:
    {{- include "pde.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl-backend
      image: curlimages/curl:8.8.0
      command: ['curl', '--fail', '--retry', '5', '--retry-delay', '5',
                'http://backend-svc.{{ include "pde.namespace" . }}.svc.cluster.local:8000/api/health']
    - name: curl-frontend
      image: curlimages/curl:8.8.0
      command: ['curl', '--fail', '--retry', '5', '--retry-delay', '5',
                'http://frontend-svc.{{ include "pde.namespace" . }}.svc.cluster.local:80/nginx-health']
