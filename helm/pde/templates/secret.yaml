{{- if not .Values.backend.externalSecrets.enabled }}
# Direct Kubernetes Secret — for dev/test environments only.
# Production should use ExternalSecrets (AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pde.fullname" . }}-secret
  namespace: {{ include "pde.namespace" . }}
  labels:
    {{- include "pde.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.backend.env.SECRET_KEY | default "CHANGE-ME-IN-VALUES" | quote }}
  DATABASE_URL: {{ .Values.backend.env.DATABASE_URL | default "postgresql://user:pass@host:5432/pde" | quote }}
{{- else }}
# ExternalSecret — fetches secrets from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pde.fullname" . }}-secret
  namespace: {{ include "pde.namespace" . }}
  labels:
    {{- include "pde.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.backend.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "pde.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.backend.externalSecrets.remoteRef }}
        property: SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.backend.externalSecrets.remoteRef }}
        property: DATABASE_URL
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.backend.externalSecrets.remoteRef }}
        property: POSTGRES_PASSWORD
{{- end }}
