apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: {{ include "pde.namespace" . }}
  labels:
    {{- include "pde.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pde.frontend.selectorLabels" . | nindent 4 }}
