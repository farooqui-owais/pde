services:
  db:
    image: postgres:16-alpine
    container_name: pde-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pde
    ports:
      - "5432:5432"
    volumes:
      - pde_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pde"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./pde-backend
    container_name: pde-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pde
      SECRET_KEY: CHANGE_ME_demo_only_do_not_use_in_production_0123456789ABCDEF
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      # Dev settings — DEBUG=True keeps Swagger /docs reachable in local dev.
      DEBUG: "True"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_COOKIE_SECURE: "False"
      CSRF_COOKIE_SAMESITE: lax
      RATE_LIMIT_MAX: 8
      RATE_LIMIT_WINDOW_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./pde-frontend
    container_name: pde-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pde_pgdata:
